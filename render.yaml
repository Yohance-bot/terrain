services:
  - type: web
    name: run-backend
    runtime: python
    plan: free
    rootDir: .
    healthCheckPath: /health
    buildCommand: "python backend/scripts/build_codebase_context.py && pip install uv && cd backend && uv sync --frozen --no-dev"
    startCommand: "cd backend && uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_OPERATIONS_TOKEN
        sync: false
      - key: ADMIN_FRONTEND_URL
        sync: false
      - key: MAX_ACCURACY_M
        value: "50"
      - key: MIN_PRESENCE_M
        value: "1"
      - key: PIPELINE_VERSION
        value: "1"
      - key: RULESET_VERSION
        value: "1"
      - key: TERRITORY_CITY
        value: "bengaluru"
      - key: TERRITORY_AREA
        value: "mvp"
      - key: LOG_HTTP_422_RESPONSE_BODIES
        value: "false"
      - key: DEVELOPER_MODE_ENABLED
        value: "true"
      - key: LOCAL_ACCOUNTS_ENABLED
        value: "false"
      - key: AUTHENTICATED_ACCOUNTS_ENABLED
        value: "true"
      - key: GROQ_API_KEY
        sync: false

  - type: web
    name: run-admin
    runtime: static
    rootDir: .
    buildCommand: "npm --prefix admin ci && npm --prefix admin run build"
    staticPublishPath: "admin/dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: run-backend
          envVarKey: RENDER_EXTERNAL_URL
